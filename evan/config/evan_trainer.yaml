hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  train_batch_size: 256
  gen_batch_size: ${data.train_batch_size}
  val_batch_size: 512
  max_prompt_length: 4096
  max_response_length: 4096
  filter_overlong_prompts: True
  filter_overlong_prompts_workers: null
  min_pixels: 200704
  max_pixels: 1003520
  format_prompt: null
  custom_cls:
    path: pkg://evan.dataset
    name: EVANDataset

actor_rollout_ref:
  model:
    use_fused_kernels: True
  actor:
    optim:
      lr: 1e-6
      lr_warmup_steps: 10
      weight_decay: 0.1
    ppo_mini_batch_size: 32
    use_dynamic_bsz: True
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
  rollout:
    name: vllm
    n: 8
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    enable_chunked_prefill: False
    engine_kwargs:
      vllm:
        disable_mm_preprocessor_cache: True
    val_kwargs:
      temperature: 1.0
      do_sample: True

custom_reward_function:
  path: pkg://evan.reward
  name: compute_score

reward_model:
  reward_manager: dapo

algorithm:
  adv_estimator: grpo
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: True
    metric: accuracy
    max_num_gen_batches: 10

evan:
  rollout_n: 2
  advantage_scale: 0.5

trainer:
  project_name: evan
  experiment_name: evan
  n_gpus_per_node: 4
  nnodes: 1
  total_training_steps: 300
  test_freq: 5
  save_freq: 100
  max_actor_ckpt_to_keep: 1

ray_kwargs:
  ray_init:
    address: local
    runtime_env:
      env_vars:
        VLLM_USE_FLASHINFER_SAMPLER: "0"
